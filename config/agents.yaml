# Agent registry — single source of truth for which agents are active.
#
# An entry with `active: false` means the agent class exists but is not loaded
# (channel binding in channels.yaml will skip dispatch). Useful for staged rollout.
#
# Phase column tracks blueprint v1.1 phases (1 = required for production,
# 2 = added in 4-6 week window, 3 = framework polish).

schema_version: 1
last_updated: 2026-04-30

agents:
  # ── Phase 0 (existing, active in production) ──────────────────────
  - key: pm
    class: ap_org_bot.agents._core.pm.PMAgent
    layer: core
    phase: 0
    active: true
    prompt: pm
    model: claude-sonnet-4-6

