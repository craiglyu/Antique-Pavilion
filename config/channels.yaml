# Discord channel registry for AP ORG Bot.
#
# Single source of truth for: which channel IDs exist, and which agent (if any)
# is bound to each channel. The bot loads this at startup; on_message dispatches
# by channel_id → agent_key lookup (no if/elif chain).
#
# Adding a new agent-bound channel: add an entry here + ensure the agent_key
# matches a row in agents.yaml. No bot code change required.
#
# IDs stay in sync with .env.antique fallbacks in scripts/ap_org_bot/main.py.

schema_version: 1
last_updated: 2026-04-30

