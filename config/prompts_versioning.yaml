# Watchpoints（mirror Thor V0.1 monthly review）
watchpoints:
  bot_max_turns_failures_per_week:
    threshold: 5
    action: "Bump max-turns 或重構 prompt（目前已從 Phase B 教訓改過）"
  
  prompt_yaml_drift:
    description: "ap_org_bot.py 內 prompt 跟此 yaml 紀錄版本不符"
    threshold: any
    action: "立刻同步 yaml + Notion"
  
  skill_lint_failures:
    description: "skill_lint.py（待建）跑出 ERROR"
    threshold: 1
    action: "PR gate block，修復後才能 commit"

